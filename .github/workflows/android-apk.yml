name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android packages (same version as in package.json)
        run: |
          CORE=$(node -p "const d=require('./package.json');(d.dependencies||{})['@capacitor/core']||(d.devDependencies||{})['@capacitor/core']||''")
          MAJOR=$(echo "$CORE" | sed 's/[^0-9]*\([0-9][0-9]*\).*/\1/')
          if [ -z "$MAJOR" ]; then MAJOR=6; fi
          echo "Capacitor major version: $MAJOR"
          npm install @capacitor/core@$MAJOR @capacitor/cli@$MAJOR @capacitor/android@$MAJOR

      - name: Set Android options in capacitor.config.json
        run: |
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.android=Object.assign({},c.android,{allowMixedContent:true});c.server=Object.assign({},c.server,{androidScheme:'https'});fs.writeFileSync(f,JSON.stringify(c,null,2));"

      - name: Create Android project (only if it does not exist yet)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copy web files into Android project
        run: npx cap sync android

      - name: Add permissions (mic, camera) and allow HTTP to server
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: messenger-2026-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
