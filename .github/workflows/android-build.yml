name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS packages
        run: npm install

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Permissions and http to server
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO',
                   'android.permission.CAMERA', 'android.permission.MODIFY_AUDIO_SETTINGS']
          add = ''.join('    <uses-permission android:name="%s" />\n' % x for x in perms if x not in s)
          s = re.sub(r'(<manifest[^>]*>\n)', lambda m: m.group(1) + add, s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: messenger-2026-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
