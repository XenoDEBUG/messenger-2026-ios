name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS packages
        run: npm install

      - name: Point app to server (API_BASE) for Android
        run: |
          python3 - <<'PY'
          import re, sys
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          server = 'http://212.80.7.210:20107'
          new_line = ('const API_BASE = (location.hostname === "localhost" || location.protocol === "file:" || location.protocol === "capacitor:") '
                      '? "%s" : "";') % server
          s, n = re.subn(r'^[ \t]*const API_BASE\s*=.*$', lambda m: new_line, s, count=1, flags=re.M)
          if n == 0:
              print('ERROR: строка const API_BASE не найдена в www/index.html')
              sys.exit(1)
          s, k = re.subn(r'\bio\(\s*\)', 'io(API_BASE || undefined)', s)
          s, m = re.subn(r'\bio\(\s*\{', 'io(API_BASE || undefined, {', s)
          print('io() заменено:', k, '| io({ заменено:', m)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Allow http to server in capacitor.config.json
        run: |
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.android=Object.assign({},c.android,{allowMixedContent:true});fs.writeFileSync(f,JSON.stringify(c,null,2));"

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Permissions and cleartext traffic
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO',
                   'android.permission.CAMERA', 'android.permission.MODIFY_AUDIO_SETTINGS']
          add = ''.join('    <uses-permission android:name="%s" />\n' % x for x in perms if x not in s)
          s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + '\n' + add.rstrip('\n'), s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: messenger-2026-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
