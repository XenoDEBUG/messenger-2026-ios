name: Deploy files check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", "deploy/**", ".github/workflows/deploy-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config > /dev/null && echo "compose ok"
      - name: Build server image
        run: docker build -t messenger-server ./server
