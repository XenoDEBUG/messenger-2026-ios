name: iOS native build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build (unsigned, iPhone)
        working-directory: ios-native
        run: |
          xcodebuild -project Messenger.xcodeproj -scheme Messenger \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Messenger-native.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: messenger-native-ipa
          path: ios-native/Messenger-native.ipa
