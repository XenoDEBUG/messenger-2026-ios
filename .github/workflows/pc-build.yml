name: PC portable exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pc/**", ".github/workflows/pc-build.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: messenger-2026-pc-portable
          path: pc/dist/*.exe
